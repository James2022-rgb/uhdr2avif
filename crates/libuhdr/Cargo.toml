[package]
name = "libuhdr"
version = "0.3.0"
edition = "2024"

[features]
default = ["avif"] 
exr = ["dep:exr"]
avif = ["dep:rav1e", "dep:avif-serialize"]
heif = ["dep:libheif-rs", "dep:four-cc"]

[dependencies]
num-traits = "0.2"
num-derive = "0.4"
derive_more = { version = "2", features = ["full"] }
log = "0.4"

# `zune-jpeg` must be a version that supports `ImageInfo::multi_picture_information`.
zune-jpeg = { git = "https://github.com/etemesi254/zune-image", rev = "4a073b1" }
# zune-jpeg = { path = "../../../zune-image/crates/zune-jpeg" } # Use this instead when developing locally; The version on crates.io does not support `ImageInfo::multi_picture_information`.
roxmltree = "0.20.0"
lcms2 = "6.1.0"

exr = { optional = true, version = "1.73.0" }
rav1e = { optional = true, version = "0.7.1", default-features = false, features = ["threading"] }
avif-serialize = { optional = true, version = "0.8" }
libheif-rs = { optional = true, git = "https://github.com/cykooz/libheif-rs", rev = "a5ed897", default-features = false, features = ["v1_19", "embedded-libheif"] }
four-cc = { optional = true, version = "0.4.0" }

[dev-dependencies]
image = "0.25.9"
