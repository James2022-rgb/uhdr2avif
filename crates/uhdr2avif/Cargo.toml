[package]
name = "uhdr2avif"
version = "0.1.1"
edition = "2024"

[features]
default = []
heif = ["libuhdr/heif"]

[dependencies]
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
chrono = "0.4.41"
clap = { version = "4.5.38", features = ["derive"] }
libuhdr = { path = "../libuhdr", features = ["avif"] }
